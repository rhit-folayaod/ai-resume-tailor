[project]
name = "resume-tailor"
version = "0.1.0"
description = "Tailors a resume to a job description by selecting and ranking pre-written content. Never generates new claims."
readme = "README.md"
authors = [
    { name = "rhit-folayaod", email = "folayaod@rose-hulman.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "click>=8.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1",
    "openai>=2.53.0",
    "pydantic>=2.7",
    "pypdf>=6.15.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "uvicorn>=0.52.1",
]

[project.scripts]
resume-tailor = "resume_tailor.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
