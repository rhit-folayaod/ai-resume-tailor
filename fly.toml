# fly.toml for ai-resume-tailor
#
# See https://fly.io/docs/reference/configuration/

app = 'ai-resume-tailor'
primary_region = 'iad'

[build]

[env]
  RESUME_TAILOR_MODEL = 'gpt-4o-mini'
  XDG_CACHE_HOME = '/data/cache'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'tectonic_cache'
  destination = '/data'
